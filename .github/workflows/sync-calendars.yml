name: Sync SNL Calendars

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: snl-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm workflow started
        run: echo "SNL calendar synchronization started"

      - name: Install Microsoft Graph dependencies
        run: python -m pip install msal requests

      - name: Test OneDrive workbook download
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MSAL_CACHE: ${{ secrets.MSAL_CACHE }}
        run: python scripts/download_onedrive.py
